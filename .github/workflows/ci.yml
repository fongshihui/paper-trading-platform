name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  python-checks:
    name: Python format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check common dashboard producers simulator tests test_alpaca_integration.py

      - name: Run lint
        run: python -m ruff check common dashboard producers simulator tests test_alpaca_integration.py

      - name: Run tests
        run: python -m pytest tests test_alpaca_integration.py

  flink-tests:
    name: Flink Java tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run Maven tests
        working-directory: flink-jobs
        run: mvn test
